<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Works – Graphics | Andrea Pasqua</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Stili specifici per questa pagina -->
  <style>
      /* ========== LAYOUT A 3 COLONNE ========== */
  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    max-width: 1800px;
    margin: 0 auto;
  }

  .column {
    width: 578px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* ========== PROJECT CARD STILI ========== */
  .project-card {
    position: relative;
    overflow: hidden;
    display: block;
    border-radius: 4px;
    transition: transform var(--transition-normal);
  }

  .project-card img {
    width: 100%;
    height: auto;
    object-fit: cover;
    display: block;
    border-radius: 4px;
    transition: transform 0.5s ease, filter 0.5s ease;
  }

  .project-card:hover img {
    transform: scale(1.03); /* Zoom leggero */
    filter: blur(50px); /* Sfocatura marcata */
  }

  /* ========== TESTO SU COVER DEI PROGETTI ========== */
  .project-info {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 10;
  }

  .project-card:hover .project-info {
    opacity: 1;
  }

  .project-info h2 {
    font-family: 'Neutraface', sans-serif;
    font-weight: bold;
    font-size: 1.2rem;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
    .project-grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 40px 80px;
      text-align: center;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .overlay img {
      max-width: 90%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- HEADER FISSO -->
  <header class="site-header">
    <div class="logo-container">
      <a href="index.html">
        <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img"/>
      </a>
      <span class="header-name">Andrea Pasqua</span>
    </div>
    <nav>
      <ul class="nav-menu">
        <li><a href="about.html">About</a></li>
        <li class="dropdown">
          <a href="#">Works</a>
          <ul class="dropdown-content">
            <li><a href="works_architecture.html">Architecture</a></li>
            <li><a href="works_graphic.html">Graphics</a></li>
          </ul>
        </li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTENUTO DELLE IMMAGINI -->
  <main class="project-grid">
    <h1>Works – Graphics</h1>

    <div class="container">

      <!-- Colonna 1 -->
      <div class="column">
        <!-- Progetto 1 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/01.jpg')">
          <div class="project-info"><h2>Kitchen</h2></div>
          <img src="projects/graphic/01_cover.jpg" alt="Render Architettonico 1" />
        </a>

        <!-- Progetto 4 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/04.jpg')">
          <div class="project-info"><h2>Villa</h2></div>
          <img src="projects/graphic/04_cover.jpg" alt="Render Architettonico 4" />
        </a>
      </div>

      <!-- Colonna 2 -->
      <div class="column">
        <!-- Progetto 2 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/02.jpg')">
          <div class="project-info"><h2>VILLA</h2></div>
          <img src="projects/graphic/02_cover.jpg" alt="Render Architettonico 2" />
        </a>

        <!-- Progetto 5 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/05.jpg')">
          <div class="project-info"><h2>UFFICIO</h2></div>
          <img src="projects/graphic/05_cover.jpg" alt="Render Architettonico 5" />
        </a>
      </div>

      <!-- Colonna 3 -->
      <div class="column">
        <!-- Progetto 3 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/03.jpg')">
          <div class="project-info"><h2>PROGETTO 3</h2></div>
          <img src="projects/graphic/03_cover.jpg" alt="Render Architettonico 3" />
        </a>

        <!-- Progetto 6 -->
        <a class="project-card" href="#" onclick="openImage('projects/graphic/06.jpg')">
          <div class="project-info"><h2>SHOWROOM</h2></div>
          <img src="projects/graphic/06_cover.jpg" alt="Render Architettonico 6" />
        </a>
      </div>

    </div>
  </main>

  <!-- Overlay per l'immagine ingrandita -->
  <div id="overlay" class="overlay">
    <img id="expanded-image" src="" alt="Immagine ingrandita">
    <button onclick="closeOverlay()">Chiudi</button>
  </div>

  <!-- Script per effetto zoom -->
  <script>
    function openImage(imageUrl) {
      const overlay = document.getElementById('overlay');
      const expandedImage = document.getElementById('expanded-image');

      expandedImage.src = imageUrl;
      overlay.style.display = 'flex';
    }

    function closeOverlay() {
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'none';
    }
  </script>

</body>
</html>
