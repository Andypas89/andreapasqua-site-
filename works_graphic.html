  <!-- Stili specifici per questa pagina -->
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .column {
      width: 578px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .project-card {
      position: relative;
      overflow: hidden;
      display: block;
      border-radius: 4px;
      transition: transform var(--transition-normal);
    }
    .project-card img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      transition: transform 0.5s ease, filter 0.5s ease;
    }
    .project-card:hover img {
      transform: scale(1.03);
      filter: blur(50px);
    }
    .project-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .project-card:hover .project-info {
      opacity: 1;
    }
    .project-info h2 {
      font-family: 'Neutraface', sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: row;
    }
    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px 25px;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1000;
    }
    .nav-button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .nav-button.prev { left: 20px; }
    .nav-button.next { right: 20px; }
    .close-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1.2rem;
      padding: 10px 20px;
      cursor: pointer;
      z-index: 1000;
      border-radius: 4px;
    }
    .overlay img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<!-- Overlay per immagine ingrandita -->
<div id="overlay" class="overlay">
  <button class="nav-button prev" onclick="prevImage()"><</button>
  <img id="expanded-image" src="" alt="Immagine ingrandita">
  <button class="nav-button next" onclick="nextImage()">></button>
  <button class="close-button" onclick="closeOverlay()">×</button>
</div>

<!-- Script: ingrandimento immagini + toggle menu -->
<script>
  const images = [
    'projects/graphic/01.jpg','projects/graphic/02.jpg','projects/graphic/03.jpg',
    'projects/graphic/04.jpg','projects/graphic/05.jpg','projects/graphic/06.jpg',
    'projects/graphic/07.jpg','projects/graphic/08.jpg','projects/graphic/09.jpg',
    'projects/graphic/10.jpg','projects/graphic/11.jpg','projects/graphic/12.jpg',
    'projects/graphic/13.jpg','projects/graphic/14.jpg','projects/graphic/15.jpg',
    'projects/graphic/16.jpg','projects/graphic/17.jpg','projects/graphic/18.jpg',
    'projects/graphic/19.jpg','projects/graphic/20.jpg'
  ];
  let currentIndex = 0;

  function openImage(imageUrl) {
    const index = images.indexOf(imageUrl);
    if (index > -1) {
      currentIndex = index;
      updateExpandedImage();
      document.getElementById('overlay').style.display = 'flex';
      document.querySelector('.site-header').style.display = 'none';
    }
  }

  function closeOverlay() {
    document.getElementById('overlay').style.display = 'none';
    document.querySelector('.site-header').style.display = 'flex';
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateExpandedImage();
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateExpandedImage();
  }

  function updateExpandedImage() {
    const expandedImage = document.getElementById('expanded-image');
    if (expandedImage) {
      expandedImage.src = images[currentIndex];
    }
  }

  function toggleMenu() {
    const menu = document.querySelector('.nav-menu');
    menu.classList.toggle('active');
  }
</script>

</body>
