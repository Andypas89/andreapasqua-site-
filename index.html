  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andrea Pasqua | Portfolio Architettonico">
  <meta name="twitter:description" content="Portfolio personale di Andrea Pasqua - architetto e graphic designer. Scopri progetti residenziali, commerciali e render grafici.">

<body>
  <!-- INTRO OVERLAY -->
  <div id="intro-overlay" aria-labelledby="intro-title" role="dialog" aria-modal="true">
    <video id="intro-video" class="intro-video" playsinline muted autoplay loop preload="metadata" poster="intro-poster.jpg">
      <source src="media/enterthestudio.mp4?v=2" type="video/mp4" />
    </video>

    <!-- Testo cliccabile con fallback inline -->
    <button
      id="enter-btn"
      class="intro-enter"
      aria-label="Entra nel sito"
      onclick="(function(){var o=document.getElementById('intro-overlay');if(o){o.style.transition='opacity .35s ease';o.style.opacity='0';setTimeout(function(){o.remove();document.documentElement.classList.remove('intro-lock');document.body.classList.remove('intro-lock');},350);}})();"
    >
      <span id="intro-title">ENTER THE STUDIO</span>
    </button>

    <button id="skip-intro" class="intro-skip" aria-label="Salta intro"
      onclick="(function(){var o=document.getElementById('intro-overlay');if(o){o.style.transition='opacity .35s ease';o.style.opacity='0';setTimeout(function(){o.remove();document.documentElement.classList.remove('intro-lock');document.body.classList.remove('intro-lock');},350);}})();">
      Salta
    </button>

    <button id="play-intro" class="intro-play" hidden>Play</button>
  </div>
  
  <!-- HEADER FISSO -->
<header class="site-header">
  <div class="header-wrapper">
    <button class="hamburger" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
    <div class="logo-container">
  <a href="index.html" class="logo-link">
    <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img"/>
    <div class="logo-text">
      <span class="line1">Andrea</span>
      <span class="line2">Pasqua</span>
    </div>
  </a>
</div>


    <nav>
      <ul class="nav-menu">
        <li><a href="about.html">About</a></li>
        <li class="dropdown">
          <a href="#">Works</a>
          <ul class="dropdown-content">
            <li><a href="works_architecture.html">Architecture</a></li>
            <li><a href="works_graphic.html">Graphics</a></li>
          </ul>
        </li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="privacy.html">Privacy</a></li> <!-- Pagina Privacy -->
      </ul>
    </nav>
  </div>
</header>

<main class="home-hero">
    <div class="home-wrap">
      <section class="home-copy">
        <h1 class="home-title">HI, I'M ANDREA,<br>ARCHITECTURAL DESIGNER.</h1>
      </section>

      <figure class="home-figure">
        <img src="media/logo-big.jpg" alt="Andrea Pasqua Logo" class="home-logo" />
        <figcaption class="vertical-text">Welcome to my space</figcaption>
      </figure>
    </div>
  </main>

  <!-- Script hamburger -->
  <script>
    function toggleMenu() {
      const menu = document.querySelector('.nav-menu');
      menu.classList.toggle('active');
    }
  </script>

  <!-- SCRIPT INTRO -->
  <script>
  (function() {
    const overlay = document.getElementById('intro-overlay');
    const video   = document.getElementById('intro-video');
    const enter   = document.getElementById('enter-btn');
    const skip    = document.getElementById('skip-intro');
    const playBtn = document.getElementById('play-intro');

    // Blocca lo scroll finché l’intro è viva
    document.documentElement.classList.add('intro-lock');
    document.body.classList.add('intro-lock');

    const tryPlay = () => {
      const p = video && video.play && video.play();
      if (p && typeof p.then === 'function') {
        p.catch(() => { if (playBtn) playBtn.hidden = false; });
      }
    };

    const closeIntro = () => {
      if (!overlay) return;
      overlay.style.transition = 'opacity .35s ease';
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.remove();
        document.documentElement.classList.remove('intro-lock');
        document.body.classList.remove('intro-lock');
        // Se vuoi reindirizzare:
        // window.location.href = '/works_graphic.html';
      }, 350);
    };

    if (enter) enter.addEventListener('click', closeIntro);
    if (skip)  skip.addEventListener('click',  closeIntro);
    if (playBtn) playBtn.addEventListener('click', () => { video.play(); playBtn.hidden = true; });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') closeIntro();
    });

    tryPlay();
  })();
  </script>
</body>
</html>
