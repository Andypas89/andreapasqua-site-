<style>
  body {
    padding: 120px 40px 0;
    font-family: 'Neutraface', sans-serif;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    max-width: 1800px;
    margin: 0 auto;
    padding: 0; /* <--- RISOLVE IL PROBLEMA */
  }


    .column {
      width: 580px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      transition: transform var(--transition-normal);
    }

    .project-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.03); /* Zoom leggero */
      filter: blur(50px); /* Sfocatura marcata */
    }

    .project-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .project-card:hover .project-info {
      opacity: 1;
    }

    .project-info h2 {
      font-family: 'Neutraface', sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .column {
        width: 90%;
        max-width: 600px;
        gap: var(--space-sm);
      }

      .project-info h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
