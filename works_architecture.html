  <!-- Inizializza Masonry DOPO aver caricato i progetti -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const grid = document.querySelector('#masonry-grid');
      if (grid) {
        new Masonry(grid, {
          itemSelector: '.project-card',
          columnWidth: 578,
          gutter: 40,
          fitWidth: false,
          originLeft: true,
          originTop: true
        });
      }
    });
