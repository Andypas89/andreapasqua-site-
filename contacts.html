<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contatti | Andrea Pasqua</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon e Meta -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#ffffff" />
</head>

<body>
  <!-- HEADER FISSO -->
  <header class="site-header">
    <div class="header-wrapper">
      <button class="hamburger" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img" />
          <div class="logo-text">
            <span class="line1">Andrea</span>
            <span class="line2">Pasqua</span>
          </div>
        </a>
      </div>

      <nav>
        <ul class="nav-menu">
          <li><a href="about.html">About</a></li>
          <li class="dropdown">
            <a href="#">Works</a>
            <ul class="dropdown-content">
              <li><a href="works_architecture.html">Architecture</a></li>
              <li><a href="works_graphic.html">Graphics</a></li>
            </ul>
          </li>
          <li><a href="contacs.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="contact-main">
    <section class="contact-icons">
      <a href="https://www.instagram.com/tuo_username" target="_blank">
        <img src="icons/instagram.svg" alt="Instagram" class="icon-social" />
      </a>
      <a href="https://www.linkedin.com/in/tuo_username" target="_blank">
        <img src="icons/linkenin-black.svg" alt="LinkedIn" class="icon-social" />
      </a>
      <a href="icons/wechat-black.svg" target="_blank">
        <img src="icons/wechat-black.svg" alt="WeChat" class="icon-social" />
      </a>
      <a href="#" id="email-link">
        <img src="icons/gmail.svg" alt="Email" class="icon-social" />
      </a>
    </section>
  </main>

  <!-- FOOTER MINIMO -->
  <footer class="footer">
    <p>© 2025 Andrea Pasqua</p>
  </footer>

  <!-- SCRIPT: Hamburger + Obfuscazione email -->
  <script>
    function toggleMenu() {
      const menu = document.querySelector('.nav-menu');
      menu.classList.toggle('active');
    }

    // Email Obfuscation
    document.addEventListener("DOMContentLoaded", function () {
      const user = "andreapasqua";
      const domain = "gmail.com";
      const link = document.getElementById("email-link");
      link.setAttribute("href", "mailto:" + user + "@" + domain);
    });
  </script>
</body>
</html>
