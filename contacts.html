<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contatti – Andrea Pasqua</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <style>
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px 20px;
    }

    .icon-links {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }

    .icon-links a img {
      width: 60px;
      height: 60px;
      transition: opacity 0.3s ease;
    }

    .icon-links a:hover img {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .icon-links a img {
        width: 48px;
        height: 48px;
      }
    }

    #email-container {
      margin-top: 40px;
      font-size: 1rem;
      color: #333;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-wrapper">
      <button class="hamburger" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img"/>
          <div class="logo-text">
            <span class="line1">Andrea</span>
            <span class="line2">Pasqua</span>
          </div>
        </a>
      </div>

      <nav>
        <ul class="nav-menu">
          <li><a href="about.html">About</a></li>
          <li class="dropdown">
            <a href="#">Works</a>
            <ul class="dropdown-content">
              <li><a href="works_architecture.html">Architecture</a></li>
              <li><a href="works_graphic.html">Graphics</a></li>
            </ul>
          </li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Contattami</h1>

    <div class="icon-links">
      <a href="https://www.instagram.com/tuo_profilo" target="_blank" rel="noopener">
        <img src="icons/instagram.svg" alt="Instagram">
      </a>
      <a href="https://www.linkedin.com/in/tuo-profilo" target="_blank" rel="noopener">
        <img src="icons/linkenin-black.svg" alt="LinkedIn">
      </a>
      <a href="https://wechat.com" target="_blank" rel="noopener">
        <img src="icons/wechat-black.svg" alt="WeChat">
      </a>
    </div>

    <p id="email-container"></p>
  </main>

  <!-- JavaScript -->
  <script>
    function toggleMenu() {
      const menu = document.querySelector('.nav-menu');
      menu.classList.toggle('active');
    }

    // Email offuscata
    const user = "tuo.nome";
    const domain = "gmail.com";
    const email = `${user}@${domain}`;
    const container = document.getElementById("email-container");
    container.innerHTML = `oppure scrivimi: <a href="mailto:${email}">${email}</a>`;
  </script>
</body>
</html>
