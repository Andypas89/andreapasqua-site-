<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contatti – Andrea Pasqua</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon & Meta -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-wrapper">
      <button class="hamburger" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button>
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img"/>
          <div class="logo-text">
            <span class="line1">Andrea</span>
            <span class="line2">Pasqua</span>
          </div>
        </a>
      </div>

      <nav>
        <ul class="nav-menu">
          <li><a href="about.html">About</a></li>
          <li class="dropdown">
            <a href="#">Works</a>
            <ul class="dropdown-content">
              <li><a href="works_architecture.html">Architecture</a></li>
              <li><a href="works_graphic.html">Graphics</a></li>
            </ul>
          </li>
          <li><a href="contacts.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENUTO -->
  <main style="margin-top: 100px;">
    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 40px; min-height: 60vh; padding: 40px;">
      <!-- Gmail -->
      <a id="gmail-link" href="#" class="icon-link" aria-label="Gmail" title="Email">
        <img src="icons/gmail.svg" alt="Gmail Icon" style="width: 48px; height: 48px;">
      </a>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/andrea-pasqua/" class="icon-link" target="_blank" aria-label="LinkedIn" title="LinkedIn">
        <img src="icons/linkenin-black.svg" alt="LinkedIn Icon" style="width: 48px; height: 48px;">
      </a>

      <!-- WeChat -->
      <a href="https://wechat.com/" class="icon-link" target="_blank" aria-label="WeChat" title="WeChat">
        <img src="icons/wechat-black.svg" alt="WeChat Icon" style="width: 48px; height: 48px;">
      </a>
    </div>
  </main>

  <!-- JS: Gmail obfuscato + Hamburger -->
  <script>
    // Gmail obfuscation
    const user = "andrea.pasqua";
    const domain = "gmail.com";
    const email = `${user}@${domain}`;
    const gmailLink = document.getElementById("gmail-link");
    gmailLink.href = `mailto:${email}`;

    // Hamburger toggle
    function toggleMenu() {
      const menu = document.querySelector('.nav-menu');
      menu.classList.toggle('active');
    }
  </script>
</body>
</html>
