<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Andrea Pasqua</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Meta social -->
  <meta property="og:title" content="Andrea Pasqua | Contacts">
  <meta property="og:description" content="Get in touch with Andrea Pasqua, architect and visual designer.">
  <meta property="og:type" content="website">

  <style>
    main {
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-family: 'Neutraface', sans-serif;
      font-size: 2rem;
      margin-bottom: 40px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .social-icons img {
      width: 50px;
      height: 50px;
      transition: transform 0.2s ease;
    }

    .social-icons a:hover img {
      transform: scale(1.1);
    }

    p {
      font-size: 1rem;
      font-family: sans-serif;
    }

    @media (max-width: 768px) {
      .social-icons {
        gap: 20px;
      }

      .social-icons img {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-wrapper">
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img"/>
          <div class="logo-text">
            <span class="line1">Andrea</span>
            <span class="line2">Pasqua</span>
          </div>
        </a>
      </div>

      <nav>
        <ul class="nav-menu">
          <li><a href="about.html">About</a></li>
          <li class="dropdown">
            <a href="#">Works</a>
            <ul class="dropdown-content">
              <li><a href="works_architecture.html">Architecture</a></li>
              <li><a href="works_graphic.html">Graphics</a></li>
            </ul>
          </li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENUTO -->
<main>
  <!-- Titolo -->
  <h1>Hit me up here!</h1>

  <!-- Icone Social -->
  <div class="social-icons">
    <a href="https://www.linkedin.com/in/andrea-pasqua/" target="_blank" rel="noopener">
      <img src="icons/linkenin-black.svg" alt="LinkedIn">
    </a>
    <a href="#">
      <img src="icons/wechat-black.svg" alt="WeChat QR">
    </a>
  </div>

  <!-- QR Code WeChat -->
  <div class="wechat-qr">
    <img src="icons/wechat_qrcode.svg" alt="WeChat QR Code">
  </div>

  <!-- Form Contatto -->
  <form action="https://formspree.io/f/mrbkroqj" method="POST" class="contact-form">
    <label>
      Your name:
      <input type="text" name="name" required>
    </label>

    <label>
      Your email:
      <input type="email" name="_replyto" required>
    </label>

    <label>
      Message:
      <textarea name="message" rows="5" required></textarea>
    </label>

    <button type="submit">Send</button>
  </form>
</main>

  <!-- JS Email Obfuscation -->
  <script>
    const user = "a.pasqua89";
    const domain = "gmail.com";
    const email = `${user}@${domain}`;
    
    const link = document.getElementById("email-link");
    const text = document.getElementById("email-text");
    
    link.setAttribute("href", `mailto:${email}`);
    text.setAttribute("href", `mailto:${email}`);
    text.textContent = email;
  </script>

</body>
</html>
