<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Andrea Pasqua – Contatti</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Social Meta Tags -->
  <meta property="og:title" content="Andrea Pasqua | Contatti">
  <meta property="og:description" content="Contatta Andrea Pasqua - architetto e graphic designer.">
  <meta property="og:image" content="https://andreapasqua.com/logo.png">
  <meta property="og:url" content="https://andreapasqua.com/contact.html">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    main {
      padding: 160px 20px 80px;
      text-align: center;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .social-icons img {
      width: 48px;
      height: 48px;
      transition: transform 0.3s ease;
    }

    .social-icons a:hover img {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .social-icons {
        gap: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-wrapper">
      <button class="hamburger" aria-label="Apri menu" onclick="toggleMenu()">☰</button>
      <div class="logo-container">
        <a href="index.html" class="logo-link">
          <img src="logo.png" alt="Andrea Pasqua Logo" class="logo-img">
          <div class="logo-text">
            <span class="line1">Andrea</span>
            <span class="line2">Pasqua</span>
          </div>
        </a>
      </div>
      <nav>
        <ul class="nav-menu">
          <li><a href="about.html">About</a></li>
          <li class="dropdown">
            <a href="#">Works</a>
            <ul class="dropdown-content">
              <li><a href="works_architecture.html">Architecture</a></li>
              <li><a href="works_graphic.html">Graphics</a></li>
            </ul>
          </li>
          <li><a href="contact.html" class="active">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENUTO -->
  <main>
    <h1>Contattami</h1>

    <div class="social-icons">
      <a href="https://www.instagram.com/tuo_profilo" target="_blank" rel="noopener">
        <img src="icons/instagram.svg" alt="Instagram">
      </a>
      <a href="https://www.linkedin.com/in/tuo_profilo" target="_blank" rel="noopener">
        <img src="icons/linkenin-black.svg" alt="LinkedIn">
      </a>
      <a href="https://wechat.com/tuo_profilo" target="_blank" rel="noopener">
        <img src="icons/wechat-black.svg" alt="WeChat">
      </a>
    </div>

    <p>Email: <a href="#" id="email-link">[email protetta]</a></p>
  </main>

  <!-- JS: Menu mobile + Email -->
  <script>
    function toggleMenu() {
      document.querySelector('.nav-menu').classList.toggle('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = 'tuo.nome';      // inserisci solo il nome
      const domain = 'gmail.com';   // solo il dominio
      const email = `${user}@${domain}`;
      const link = document.getElementById('email-link');
      link.textContent = email;
      link.href = 'mailto:' + email;
    });
  </script>
</body>
</html>
